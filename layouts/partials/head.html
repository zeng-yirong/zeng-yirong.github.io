
    <title>{{ .Site.Title }}</title>

    <!-- Meta -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ .Site.Params.description }}">
    <meta name="author" content="{{ .Site.Params.author }}">

    <!-- Favicon：必须走 relURL。写成相对的 "favicon.ico" 时，/en/ 页会去找
         /en/favicon.ico（那里没有这个文件，英文页就没有图标） -->
    <link rel="shortcut icon" href="{{ "favicon.ico" | relURL }}">

    <!-- 这里原先加载 Google Fonts 的 Roboto。2026-10-03 删掉了：
         Bootstrap 的 $font-family-sans-serif 把 -apple-system / Segoe UI 排在前面，
         全仓没有任何规则把 Roboto 提到栈首 —— 所以那个请求**从来没有生效过**，
         纯粹是阻塞渲染的额外往返；而 fonts.googleapis.com 在国内还经常不通。
         字体栈现在全在 assets/scss/devresume.scss 里（系统 sans + 显式 CJK，
         衬线只给论文标题，也用本地字体）。 -->

    <!-- Open Graph / Facebook：og:url 用 .Permalink，英文页才指向 /en/ 而不是指回中文页 -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:title" content="{{ .Site.Title }}">
    <meta property="og:description" content="{{ .Site.Params.description }}">
    <meta property="og:image" content="{{ .Site.BaseURL }}assets/images/me.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="{{ .Permalink }}">
    <meta property="twitter:title" content="{{ .Site.Title }}">
    <meta property="twitter:description" content="{{ .Site.Params.description }}">
    <meta property="twitter:image" content="{{ .Site.BaseURL }}assets/images/me.png">

    <!-- Theme SCSS -->
    {{ $style := resources.Get "scss/devresume.scss" | resources.ExecuteAsTemplate "scss/devresume.scss" . | toCSS (dict "targetPath" "assets/css/devresume.css") | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $style.Permalink }}">
