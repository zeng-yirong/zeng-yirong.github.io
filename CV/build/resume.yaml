    - {title: "ClawBenchPro: Benchmarking How Well Agent Harnesses Work", authors: "Yufei Liu*, Yirong Zeng*（共一）, et al.", venue: "NeurIPS 2026", tier: "A", co: true, note: "构建 Harness 数据生产线，系统评测不同 Agent 在不同 Harness 下的表现差异"}
    - {title: "AutoTool: Automatic Scaling of Tool-Use Capabilities in RL via Decoupled Entropy Constraints", authors: "Yirong Zeng, Xiao Ding, et al.", venue: "ICLR 2026", tier: "A", first: true, note: "解耦熵约束 GRPO，解决推理模型坍塌，实现快慢思考自适应；落地华为小艺主对话"}
