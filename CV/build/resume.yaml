summary: >
  哈尔滨工业大学直博五年级（导师刘挺教授），研究方向为大模型 Agentic RL、
  Harness Agent 训练与指令遵循。以第一作者（含共一）在 NeurIPS、ICLR、ACL、
  EMNLP、NAACL、COLING、IPM 等顶级会议/期刊发表论文 9 篇（CCF-A 4 篇、CCF-B 5 篇），
  另有 6 篇 CCF-A 在投。华为小艺首批顶尖人才计划实习生、部门实习生领头人（带 7 人团队），
  产出 12 项研究成果、4 项落地小艺业务；核心指标：指令遵从 81→89、训练资源开销↓8×、
  推理开销↓32%。开源 ClawLoop⭐33 / ClawForge⭐32 / MIFS 数据集 11k+ downloads。

