internship:
  org: "华为（北京）小艺 · 基础算法开发部"
  role: "研究型实习生"
  time: "2024.09 – 至今"
  badges: ["首批顶尖人才计划实习生", "部门实习生领头人（带 7 人团队）"]
  lead: "负责小艺中控相关的先导技术探索：在 Harness Agent 训练、Agentic RL、指令遵循方向产出 12 项研究成果，其中 4 项落地小艺业务。"
  groups:
    - title: "Harness Agent 训练体系搭建"
      items:
        - text: "构建 SFT 数据生产流水线，产出 **2 万条**数据、覆盖 **42 类** Harness 使用场景，支撑大规模 Agent 训练数据供给【NeurIPS 2026 ×2】"
        - text: "主导搭建 **139 个** Agentic RL Tool 环境，支撑业务 Agentic RL 先导探索【EnvCraft ICLR 2027 在投；**ClawForge 已开源**】"
        - text: "设计轻量化 Harness，支撑大规模在线 In-Harness RL 训练，训练资源开销减少 **8 倍**、推理开销减少 **32%**【Less Harness More Signal AAAI 2027 Phase II；**ClawLoop 已开源**】"
    - title: "Agentic RL 核心算法研发"
      items:
        - text: "提出解耦熵约束策略（**AutoTool, ICLR 2026**），实现大模型使用工具时依据问题复杂度自适应调整快慢思考模式，**落地小艺主对话**"
        - text: "发现长程 Agentic RL 训练后期异常熵增的关键原因是轨迹中的无效交互，通过提前截断 + token 掩码提升训练稳定性与上限【**NeurIPS 2026**】"
        - text: "完成华为昇腾生态训练适配，初步探索训练信用分配机制【iTool EMNLP 2025；Tool Zero EMNLP 2025 Findings】"
    - title: "Agent 指令遵循性能提升"
      items:
        - text: "发现 RL 影响指令遵从能力的关键瓶颈是反馈信号质量，提出约束密度控制，低成本提升指令遵从性能上限，落地小艺主对话，相关能力 **81→89**【ICLR 2027 在投】"
        - text: "轻量专家集成方法（**TinyJudge, ACL 2026**）缓解多约束场景下 LLM 的 reward hack 问题：平均性能 +10%、奖励精度 +12%、训练速度 3×"
        - text: "探索在线策略蒸馏（OPD）在指令遵从中的应用，解耦-聚合修正教师在多约束下的分布，性能 **+4%**【ICLR 2027 在投】"

research_focus:
  - name: "智能体强化学习（Agentic RL）"
    time: "2024.09 – 至今"
    bullets:
      - "通过工具调用获取环境/人类反馈并持续更新模型参数以提升性能上限，是大模型后训练的主流核心技术方案"
      - "研究覆盖：训练稳定性与上限提升（NeurIPS 2026、EMNLP 2025×2）、自适应快慢思考（ICLR 2026）、工具环境与数据合成（NeurIPS 2026、ICLR 2027 在投）、轻量化 Harness 与 In-Harness RL（AAAI 2027 Phase II）"
      - "近期探索：通过训练 Skill Curator 实现 Agent Skill 的进化"
  - name: "指令遵循（Instruction Following）"
    time: "2025.06 – 至今"
    bullets:
      - "要求模型回答时额外满足用户指定约束，是智能体对话与长程任务执行的必备基础能力"
      - "研究覆盖：RL 训练下指令遵从泛化性机制与上限提升（ACL 2026、ICLR 2027 在投）、多模态指令遵循 RLVR 数据合成（ACL-ARR 在投）、在线策略蒸馏 OPD 应用（ICLR 2027 在投）"

