# ---------------- 以下内容与 A/B 两份一致（事实层） ----------------

summary: >
  哈尔滨工业大学直博五年级（导师刘挺教授），研究方向为大模型 Agentic RL、
  Harness Agent 训练与指令遵循。以第一作者（含共一）在 NeurIPS、ICLR、ACL、
  EMNLP、NAACL、COLING、IPM 等顶级会议/期刊发表论文 9 篇（CCF-A 4 篇、CCF-B 4 篇、SCI-Q1 1 篇），
  另有 6 篇 CCF-A 在投。华为小艺首批顶尖人才计划实习生、部门实习生领头人。

# tier: A/B/P(在投); first: 独一; co: 共一
# url: 论文链接，渲染成标题上的超链接（不再明文显示）。来源：CV/zeng-yirong_resume_all.docx；
#      那儿没有链接的篇目（2 篇 NeurIPS 2026 + 3 篇在投）就不写 url，标题照常显示、只是不可点。
# note_hidden: 该条只留事实、页面不显示 note（对应 validate.py 的 UNRENDERED["C"]）
publications:
  # pgbreak: false（2026-09-30 由 true 改来）。原先是「在投论文」另起一页（本人 2026-09-28 要求），
  #   但那是**旧顺序下**的要求：调成「教育→研究方向→论文→实习」后，论文段整体前移，
  #   在投前面换页会在第 2 页末尾空出约 400pt（半页多），直接把总页数顶到 4 页。
  #   断页位置随顺序走——现在换页点移到「实习经历」（见 order 里的 pgbreak），
  #   已录用与在投的条目本身没动，只是不再从中间断开。
  pgbreak: false
  published:
    - {title: "Unveiling Entropy-Performance Decoupling in Agentic RL for Tool-Integrated Reasoning", authors: "Yirong Zeng, Shen You, et al.", venue: "NeurIPS 2026", tier: "A", first: true,  note: "发现轨迹中的无效交互是长程 Agentic RL 训练后期性能停滞的关键原因；通过在训练中监控无效交互次数，并提前截断轨迹，实现提升训练稳定性；减少 34% 的无效交互，同时性能上限提升 3%"}
    - {title: "ClawBenchPro: Benchmarking How Well Agent Harnesses Work", authors: "Yufei Liu*, Yirong Zeng*（共一）, et al.", venue: "NeurIPS 2026", tier: "A", co: true, note: "设计 Harness 的数据生产线，合成多样化的测试数据集，评测不同 Agent 在不同 Harness 下的表现与差异"}
    - {title: "AutoTool: Automatic Scaling of Tool-Use Capabilities in RL via Decoupled Entropy Constraints", authors: "Yirong Zeng, Xiao Ding, et al.", venue: "ICLR 2026", tier: "A", first: true, note: "解耦 Agentic RL 下不同问题的熵约束策略，实现在环境交互过程中，根据难度自适应地快慢思考", url: "https://proceedings.iclr.cc/paper_files/paper/2026/hash/65ea878cb90b440e8b4cd34fe0959914-Abstract-Conference.html"}
