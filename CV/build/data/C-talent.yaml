# 数字横条 = hero 之后、正文之前那条 3 格横幅。
# 本人 2026-09-28 的要求：**不显示，但不要删——标记要以注释的形式留在产物 HTML 里，
# 以后可能会用到来启用它**，所以下面 3 条数据留着，用 kpis_comment_only 控制显示：
#   缺省（不写这个键）或 false = 正常渲染这条横幅
#   true                          = 只把横条标记原样写成一段 HTML 注释（当前状态）
# 启用时改这一行即可（模板里注释与渲染用的是同一段标记，逐字相同），**不要直接改产物 HTML**
# ——build.py 一跑就覆盖。横条约 40px，启用后第 1 页高度会变，必须复核页数与断页。
kpis:
  - {num: "9",  label: "一作已发表论文"}
  - {num: "4",  label: "CCF-A 已发表"}
