  - {num: "4",  label: "成果落地小艺"}
  - {num: "7",  label: "带教实习生(领头人)"}

# 页脚页码（本人 2026-09-30 要求，与 B 同步）。**这是开关，不是内容**：删掉这行就没有页码。
# 2026-09-30 为它改了 C 模板的 @page：`margin:0` → `margin:0 0 14mm`，
# 让出页面底部 10mm 给页脚落位（B 是 14mm；C 内容更满，14mm 会多出一页）。
# 原来 C 的 @page 下边距是 0，页脚会被画到正文上——build.py 的 check() 现在
# 登记了每版的带子，不让再踩。带宽的选取与实测余量见模板里 @page 那条注释。
page_numbers: true

order:
  - summary
  # icon = 段落标题圆角块里的图标名（模板 ICON 字典）：education / internship / research /
  #   opensource / projects / awards / skills；个人简介的图标由模板定（summary）。
  #   写不认识的名字会原样输出（旧的 emoji 也还能用），但别混用——2026-09-28 起统一成单色 SVG。
  #
  # 2026-09-30：核心四段改成与 B 同一顺序——教育背景 → 研究方向 → 发表论文 → 实习经历。
  #   原顺序是「教育 → 实习 → 研究方向 → 论文」（当时按「先讲干了什么、再讲研究方向」排的）。
  #   只动核心四段：下面两行并排的搭配与 ratio 保持原样（荣誉奖项｜开源项目、其他项目｜技能），
  #   那两组栏宽比是按两栏实际高度配平过的，别顺手改（见 ratio 那两行的注释）。
  - {rail: [education],      icon: "education",  title: "教育背景"}
  - {rail: [research_focus], icon: "research",   title: "研究方向"}
  - publications                      # ← 论文卡片保持独立，不并入导轨
  # pgbreak: true = 这一段另起一页（本人 2026-09-30 定：调顺序后换页点从「研究方向」
  #   移到这里）。放在实习经历上，第 3 页就是「实习经历 → 荣誉奖项｜开源项目 →
  #   其他项目｜技能」，页顶带 26px 留白、不贴着纸边。
  #   断页是排版指令、不是事实，所以写在数据里而不是模板里——换版式/换页数时改这里。
  #   ⚠️ 断页位置与页脚带子（@page 下边距 10mm）是算出来的：C 各块实测高度合计约 2381.7pt，
  #   3 页容量 3×805.2=2415.6pt，三页各余 29 / 32 / 80pt。再往 C 里加字、
  #   松间距、或把带宽加到 14mm（那要再吃掉 3×11pt），都会掉到 4 页。改完必须复核页数。
  - {rail: [internship],     icon: "internship", title: "实习经历", pgbreak: true}
  # 并排一行两栏的两种写法（栏内写法与单栏时完全一样）：
  #   [左, 右]                         两栏等宽
  #   {pair: [左, 右], ratio: [a, b]}   逐行栏宽比 a:b
  # 配平只有「把高的一栏加宽」这一个方向：行高 = max(左栏, 右栏)，只压矮栏没用。
  # 只支持一行两栏：栏再窄，139 个环境/论文标题也还排得下；三栏就挤了。
  # rail 字典可加 note（段落说明，排在标题下、导轨之上）；当前没有段落用它，留着备用。
  - {pair: [awards, {rail: [opensource], icon: "opensource", title: "主导的开源项目"}],
     ratio: [0.78, 1.22]}       # 开源那栏 3 条最长 → 加宽它，让它矮下来
  - {pair: [{rail: [projects], icon: "projects", title: "其他项目"}, skills],
     ratio: [1.12, 0.88]}       # 这行反过来：其他项目才是高栏；别压到 260px 以下，
                                # 否则「惊堂木 … 小程序」那行的「主导开发」会被折成「主导开 / 发」

# 经历时间轴：education / internship / research_focus / opensource / projects
# 条目字段（按需出现）：
