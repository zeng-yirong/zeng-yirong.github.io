summary:
  - "曾屹荣，来自哈尔滨工业大学，社会计算与交互机器人研究中心 2022级直博生，导师刘挺教授。顶刊顶会人才；曾获得国家奖学金，ACM银牌等；入选中国科协青年培育工程。主要研究方向为大模型 Agentic RL、 Harness Agent 训练与指令遵循。以第一作者（含共一）在 NeurIPS、ICLR、ACL、EMNLP、NAACL、COLING、IPM 等顶级会议/期刊发表论文 9 篇（CCF-A 4 篇、CCF-B 4 篇、SCI-Q1 1 篇），另有 6 篇 CCF-A 在投。"
  - "2024年9月起至今在华为终端，基础算法开发部门实习。在实习期间，表现优秀，成为部门首批顶尖人才计划博士生实习生，部门内部实习生领头人；带领实习生团队，重点参与小艺的全模态大模型系统训练技术的先导探索：在 Agentic RL、Harness Agent 训练、指令遵循方向产出 12 项研究成果，其中 4 项落地小艺业务。博士方向与部门重点研究方向高度匹配，有潜力在未来业务中做出关键突破，高价值成果。"
  - "科研经历上围绕大模型后训练的展开: (1)Agentic RL：定位长程训练后期性能停滞的关键原因（轨迹中的大量无效交互），以提前截断 + token 掩码、解耦熵约束等方法提升训练稳定性与性能上限；(2) Harness Agent 训练体系：搭建 SFT 数据生产线 (2+ 万条、42 类场景) 与 139 个工具交互环境，用轻量化 Harness 支撑大规模 In-Harness RL；(3) Agent中指令遵循泛化性提升：揭露出反馈信号质量是关键瓶颈，提出以多约束密度控制与轻量专家集成等方法提升指令遵从上限，并把成果落地小艺自研模型。"

