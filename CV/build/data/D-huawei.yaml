# ============================================================
# 样式 D · 华为专供版（科技风 · 时间轴，**与 C 共用模板**）
# 只服务 D 版：cd CV/build && python build.py --style D
#
# 2026-10-08 新建，派生自 C（data/C-talent.yaml）。与 C 的差异**只有三处**，都是本人要求：
#   1. 模块顺序：实习经历 ↔ 研究方向 逐位对调 —— C 是「教育→研究方向→论文→实习」，
#      D 是「教育→实习→论文→研究方向」。
#   2. 个人简介：换成面向华为的两段版（见文件末尾 summary，比 C 的长）。
#   3. 实习时间：条目上的 `2024.09 – 2026.09` 改成 `2024.09 – 至今`——本人 2026-10-08
#      明确「华为专供版本实习时间统一改成至今」，这样才和简介里「2024年9月起至今…」一致。
#      ⚠️ 这是**有意**的第 3 处事实差异：A/B/C 三份仍写 2026.09（已结束），
#      validate 的跨版本比较会把它报出来，别当漏改去同步。
#
# 模板：**与 C 共用** style-C-tech-timeline.html.j2（本人 2026-10-08 拍板）。
#   这是「一版一模板」的一处明示例外：D 与 C 只差数据，照抄一份 411 行的模板
#   只会让以后每改一次 C 的版式都要手动同步两遍。将来真要分家再复制。
# 产物：**不上线**。HTML 与 PDF 都留在 CV/build/output/，不写进 static/cv/、
#   也不进主页头部那行链接（本人 2026-10-08 选「只出文件，不上线」）。
#
# 版面即结构：
#   hero     = 顶部纯色横幅（照片 / 联系方式）
#   kpis     = 3 格数字横条（只放学术指标）
#   order    = 显示顺序。字符串 = 整块段落；{rail: [type...]} = 从 timeline
#              里取出这些 type 的条目，渲染成一条时间轴（条目顺序 = timeline 数组顺序）；
#              数组 = 该行的两栏并排（如 [awards, {rail: [opensource], ...}]）；
#              {pair: [左, 右], ratio: [a, b]} = 并排 + 逐行栏宽比（配平两栏高度，见下）；
#              行上加 pgbreak: true = 该段另起一页（本人要求的两处断页见 order 里的注释）
#   timeline = 唯一一份经历数据，每条带 type
#
# 段落标题的图标（order[].icon）写模板 ICON 字典里的名字（education/internship/research/
#   opensource/projects/awards/skills），2026-09-28 起由彩色 emoji 换成单色 SVG
#   ——与 hero 的单色线性图标统一，也不再依赖本机 emoji 字体。
#
# 想改成「一条大时间轴」？把下面 5 行 rail 合并成一行即可：
#   - {rail: [education, internship, research_focus, opensource, projects],
#      icon: "internship", title: "经历时间轴"}
#   代价：荣誉奖项/发表论文是独立卡片，进不了导轨（导轨只装 timeline 里的经历条目）；
#        且少了 4 个段落标题 ≈ 200px，重建后要复核页数（README 记的基线是 A/B 4 页、C 3 页）。
#
# 本文件与 A/B 两份不共享任何字段，但承载的事实必须一致：
#   改完任一份后跑  python validate.py  校验三份事实无差异
# ============================================================
style: "D"
version: "华为专供版"

