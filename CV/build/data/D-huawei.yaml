# 页脚页码（本人 2026-09-30 要求，与 B 同步）。**这是开关，不是内容**：删掉这行就没有页码。
# 2026-09-30 为它改了 C 模板的 @page：`margin:0` → `margin:0 0 14mm`，
# 让出页面底部 10mm 给页脚落位（B 是 14mm；C 内容更满，14mm 会多出一页）。
# 原来 C 的 @page 下边距是 0，页脚会被画到正文上——build.py 的 check() 现在
# 登记了每版的带子，不让再踩。带宽的选取与实测余量见模板里 @page 那条注释。
page_numbers: true

# 续页（第 2、3 页）的页顶留白，单位 px。缺省 = 20（C 的值），D 单独调大：
# 本人 2026-10-08 看过成品后要求「增大 2、3 页的头部页边距」——本页尾部空白偏大，
# 把续页的留白加大，内容整体下移、末页尾部收紧。模板里走 --top-pad（见 :root 那段注释），
# **第 1 页不受它影响**（第 1 页的页顶留白是 .content 自己的 padding）。
# ⚠️ 它是「每页少装内容」的旋钮：调大必须复核页数，取值见 README 2026-10-08 那节的实测表。
# 实测：20 → 末页余 123pt；32 → 余 55pt（定稿）；**35 是 3 页内的最大值、36 掉第 4 页**。
# 取 32 而不是 35，是给「换台机器字体不同、分页会变」留 3px 余量（PDF 分页依赖本机字体）。
# 这个值**只管续页的页顶**：h2/小标题与正文之间那两道缝由模板的负外边距抵掉了（见 .pubs）。
page_top_pad: 32

# 论文区那两道缝的两个旋钮（本人 2026-10-08：「已录用论文与在投论文可以减少间距，
# 来为个人简介节省空间」——第三段科研经历加进来之后第 1 页装不下了）。
#   pubs_gap    = 论文列表盒首那道缝（h2 下面、「在投论文」小标题下面），C 缺省 20
#   subhead_gap = 「在投论文」小标题**上方**的留白，C 缺省 30
# 两个一起压才既省地方、又保住「上缝 > 下缝」（本人上一轮专门要求过方向，见模板 .subhead 注释）。
pubs_gap: 10
subhead_gap: 18
# 注：本来还准备了一档 `compact: true`（卡片内边距 8→6px、卡片间距 8→4px、
#   段间距 23→17px、条目行距 1.5→1.47）来换 3 页，**后来实测不需要**——撤掉「研究方向」
#   那一段本身就够了（实测保持 C 的间距也是 3 页，而且实习的分组还能保持整块不拆，
#   第 2 页正好从「Harness Agent 训练体系搭建」这个分组开头起）。所以这一版与 C
#   的字体/间距完全一致，差别只在「少了哪几段、哪几段换了位置」。

order:
  - summary
  # icon = 段落标题圆角块里的图标名（模板 ICON 字典）：education / internship / research /
  #   opensource / projects / awards / skills；个人简介的图标由模板定（summary）。
  #   写不认识的名字会原样输出（旧的 emoji 也还能用），但别混用——2026-09-28 起统一成单色 SVG。
  #
  # 2026-09-30：核心四段改成与 B 同一顺序——教育背景 → 研究方向 → 发表论文 → 实习经历。
  #   原顺序是「教育 → 实习 → 研究方向 → 论文」（当时按「先讲干了什么、再讲研究方向」排的）。
  #   只动核心四段：下面两行并排的搭配与 ratio 保持原样（荣誉奖项｜开源项目、其他项目｜技能），
  #   那两组栏宽比是按两栏实际高度配平过的，别顺手改（见 ratio 那两行的注释）。
  - {rail: [education],      icon: "education",  title: "教育背景"}
  # 与 C 不同的第 1 处：实习经历 ↔ 研究方向 逐位对调（本人 2026-10-08 要求）。
  #   C 的顺序是「教育 → 研究方向 → 论文 → 实习」，D 把这两段互换：
  #   「教育 → 实习 → 论文 → 研究方向」。论文卡片仍是独立一段、位置不动。
  - {rail: [internship],     icon: "internship", title: "实习经历"}
  # 断页挂在**论文段**上（D 的换页点，2026-10-08 实测定下来的）：
  #   实习经历整段升到第 1 页后，论文段正好落在第 2 页页首。不给它 pgbreak 的话
  #   没有 .pgbreak 那 20px 页顶留白，标题会贴到纸边 **2pt**（C 早先踩过同一个坑，
  #   本人当时的原话是「第二页上边距太小」）。整块段落要带断页就得写成 {block: …}，
  #   光写字符串 `- publications` 带不了 pgbreak（模板只从 mapping 行读）。
  # 实测（3 页）：p1 22→796、p2 2→777、p3 22→692；加了这个断页后 p2 页顶回到 22pt。
  # ⚠️ 断页是排版指令、不是事实，写在数据里；改顺序/加内容后**必须复核页数**，
  #    而且要看真 PDF——分页是打印时才发生的（见 README「本机调试小工具」）。
  - publications
  # ⚠️ 与 C 不同的第 5 处（2026-10-08 本人定）：「研究方向」这一整段**不显示**。
  #   原因：简介第三段「科研经历」把三条研究主线（Agentic RL / Harness Agent / 指令遵循）
  #   连同方法、数字、会议都写进去了，这一段（253px）与它重复；而加了第三段之后内容
  #   已经塞不进 3 页——实测只有撤掉它才收得进（这笔账记在 README 2026-10-08 那节）。
  #   **数据没删**：timeline 里那两条 research_focus 还在（带 `unrendered: true`，
  #   build.py 那道「有没有 rail 选中」的检查认这个标记），validate.py 的
  #   UNRENDERED["D"] 也逐条列了它们——与 B 的「技能段转注释」是同一套路。
  #   要恢复：取消下面这行的注释，并删掉那两处的 unrendered 标记与 UNRENDERED["D"]。
  #   ⚠️ 恢复前先量页数：它就是 D 从 4 页变 3 页的那一刀。
  # - {rail: [research_focus], icon: "research",   title: "研究方向"}
  # 并排一行两栏的两种写法（栏内写法与单栏时完全一样）：
  #   [左, 右]                         两栏等宽
  #   {pair: [左, 右], ratio: [a, b]}   逐行栏宽比 a:b
  # 配平只有「把高的一栏加宽」这一个方向：行高 = max(左栏, 右栏)，只压矮栏没用。
  # 只支持一行两栏：栏再窄，139 个环境/论文标题也还排得下；三栏就挤了。
  # rail 字典可加 note（段落说明，排在标题下、导轨之上）；当前没有段落用它，留着备用。
  - {pair: [awards, {rail: [opensource], icon: "opensource", title: "主导的开源项目"}],
     ratio: [0.78, 1.22]}       # 开源那栏 3 条最长 → 加宽它，让它矮下来
  - {pair: [{rail: [projects], icon: "projects", title: "其他项目"}, skills],
     ratio: [1.12, 0.88]}       # 这行反过来：其他项目才是高栏；别压到 260px 以下，
                                # 否则「惊堂木 … 小程序」那行的「主导开发」会被折成「主导开 / 发」

# 经历时间轴：education / internship / research_focus / opensource / projects
# 条目字段（按需出现）：
#   type(必填)  time(右侧时间胶囊)  meta(时间胶囊追加，如 ⭐33)
#   title(主标题) sub(副标题，灰色)  badges(小徽章)
#   body(一段说明) link(完整 URL：渲染成标题上的超链接，不再明文显示)
#   logo(平台标志：github / modelscope，模板里画成内联 SVG)
#   bullets(要点列表) groups(子分组 [{title, items[]}])
# 行内加粗（**xx** 渲染成模板里的 <em>，琥珀色）：2026-09-28 本人手改产物后只剩两类——
#   论文/会议名、关键数字（81→89）；实习条目里的产出数字不再加粗（那些 ** 已按手改删掉）。
# awards 条目字段：text(奖项名) year(年份) star(★ 标记) subs(该奖名下的多个子点，逐条列出)
timeline:
  - type: education
    time: "2022.09 – 至今（预计 2027.09 毕业）"
    title: "哈尔滨工业大学"
    sub: "直博五年级 · 博士候选人 · 计算学部 · 计算机科学与技术"
    badges: ["科协青培博士人才", "华为顶尖人才计划实习生"]
    bullets:
      - "导师：刘挺教授（校长）；实验室：社会计算与交互机器人研究中心（SCIR）"
      - "研究方向：自然语言处理、大模型、Agentic RL、Harness Agent 训练、指令遵循"
      - "一作发表论文 9 篇（CCF-A 4 篇、CCF-B 4 篇、SCI-Q1 1 篇），另有 6 篇 CCF-A 在投"
  - type: education
    time: "2018.09 – 2022.07"
    title: "哈尔滨工程大学"
    sub: "本科 · 计算机科学与技术"
    badges: ["国家奖学金", "ACM银牌"]
  - type: internship
    time: "2024.09 – 至今"          # 与 C 不同的第 3 处（本人 2026-10-08：华为专供版统一改成「至今」）
    title: "华为（北京）小艺 · 基础算法开发部"
    sub: "AI算法工程师"
    # 头衔与身份是两件事（本人 2026-09-28 定）：职位写「AI算法工程师」，
    # 身份「研究型实习生」放在 body 里用「作为…」连接——不要并排成两个身份。
    badges: ["首批顶尖人才计划实习生", "部门实习生领头人（带 7 人实习生团队）"]
    body: "作为研究型实习生，负责小艺的全模态大模型系统训练技术的先导探索：在 Agentic RL、Harness Agent 训练、指令遵循方向产出 12 项研究成果，其中 4 项落地小艺业务。"
    groups:
      - title: "Agentic RL 算法研发"
        items:
          - "发现长程 Agentic RL 训练后期性能停滞/崩溃的一个关键原因是轨迹中的大量无效交互，通过提前截断轨迹 + token 掩码提升训练稳定性与上限【**NeurIPS 2026**; ICLR2027 在投】"
          - "提出解耦熵约束策略，实现大模型使用工具时依据问题复杂度自适应调整快慢思考模式 【**AutoTool, ICLR 2026**】"
          - "昇腾训练生态适配，探索 RL 训练信用分配机制，发表首篇面向通用领域基于 GRPO 进行 Agentic Tool Use 训练的论文【**Tool Zero, EMNLP 2025**; iTool, EMNLP 2025】"
      - title: "Harness Agent 训练体系搭建"
        items:
          - "构建 SFT 数据生产流水线，产出 2+ 万条数据、覆盖 42 类 Harness 使用场景，支撑大规模 Agent 训练数据供给【NeurIPS 2026】"
          - "主导搭建 139 个 Agentic RL Tool 环境，支撑业务 Agentic RL 先导探索【ICLR 2027 在投】"
          - "设计轻量化 Harness，支撑大规模在线 In-Harness RL 训练，训练资源开销减少 8 倍、推理开销减少 32%【AAAI 2027 在投】"
      - title: "Agent 指令遵循性能提升"
        items:
          - "发现 RL 影响指令遵从能力的关键瓶颈是反馈信号质量，提出多约束下的密度控制，低成本提升指令遵从性能上限，落地小艺自研模型，对话满意度 **81→89**【ICLR 2027 在投】"
          - "轻量专家集成方法缓解多约束场景下强化学习的 reward hack 问题：平均性能 +10%、奖励精度 +12%、训练速度 3× 【**TinyJudge, ACL 2026**】"
          - "探索在线策略蒸馏（OPD）在指令遵从中的应用，解耦-聚合修正教师在多约束下的分布，性能 +4%【ICLR 2027 在投】"
  - type: research_focus
    unrendered: true          # 未渲染（保留事实）：本版不显示「研究方向」段，见 order 里的注释
    time: "2024.09 – 至今"
    title: "智能体强化学习（Agentic RL）"
    bullets:
      - "通过工具调用获取环境与人类反馈、持续更新模型参数来提升性能上限，是大模型后训练的主流技术路线"
      - "研究覆盖：长程训练的稳定性与上限提升（NeurIPS 2026、EMNLP 2025×2、ICLR2027 在投）、自适应快慢思考（ICLR 2026）、工具环境与数据合成（NeurIPS 2026、ICLR 2027 在投）、轻量化 Harness 与 In-Harness RL（AAAI 2027 在投）"
      # 2026-10-03 按要求从简历里注释掉（个人主页保留）。
      # - "近期探索：通过训练 Skill 管理器来实现 Agent Skill 的进化"
  - type: research_focus
    unrendered: true          # 未渲染（保留事实）：同上
    time: "2025.06 – 至今"
