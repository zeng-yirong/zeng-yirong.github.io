# ============================================================
# 样式 B · 研究院版（极简单栏学术风，打印最佳）
# 只服务 B 版：cd CV/build && python build.py --style B
#
# 版面即结构：
#   header   = 居中页眉；contact_lines 是「行 × 行内元素」，
#              每个子数组渲染成一行（行内用 ｜ 连接）——换行是版式的一部分
#   sections = 扁平有序段落表；数组顺序 = 显示顺序，
#              title/en 是该段的中英文表头（可改标题而不动模板）
#
# 本文件与 A/C 两份不共享任何字段，但承载的事实必须一致：
#   改完任一份后跑  python validate.py  校验三份事实无差异
#
# 2026-09-28：summary 以下的全部内容已按 C 版重写对齐——C 是本人在维护的那一份，
#   A/B 当时没跟上，三份出现了三套说法。同步后 A/B/C 的文字与事实一致，差别只剩版式。
#   **以后只改 C 的话 A/B 会再次漂移**：改完 C 记得跑 validate.py，它会指出 A/B 少/多了哪条。
# ============================================================
style: "B"
version: "研究院版"

# 页脚页码（本人 2026-09-30 要求）。**这是开关，不是内容**：删掉这行就没有页码。
# 由 build.py 的 PAGE_FOOTER 渲染成「第 x 页 / 共 y 页」，画在页面底部那条页边距带子里
# （B 的 @page 下边距 14mm，原本就空着），所以不吃正文高度、不动分页——实测页数不变。
# 能不能开由 @page 有没有留出底部带子决定（见 build.py 的 FOOTER_BAND 登记）：
# 2026-09-30 起 B/C 都开了；A 的 @page 下边距是 0，开着会被 check() 直接报错挡住。
page_numbers: true

header:
  name: "曾屹荣"
  en_name: "Yirong Zeng"
  tagline: "博士候选人 · 智能体强化学习 / 长程 Agent 训练"
  contact_lines:                  # 每个子数组 = 一行
    - ["18845723437", "yrzeng@ir.hit.edu.cn", "哈尔滨工业大学（本部）计算学部"]
    - ["导师：刘挺教授（校长）", "社会计算与交互机器人研究中心（SCIR）", "预计毕业：2027.09"]
  # 外链：只显示标签 + 图标，**不印明文 URL**（本人 2026-09-29 要求）。
  # icon 写平台名，模板里的 ICON 字典把它换成内联 SVG（不引外链、能离线打开也能印进 PDF）。
  # 加新平台要在模板的 ICON 里加一条；写错名字不会报错，只会少一个图标，注意核对。
  links:
    - {label: "个人主页", url: "https://zeng-yirong.github.io", icon: "home"}
    - {label: "谷歌学术", url: "https://scholar.google.com/citations?user=HZgQfW0AAAAJ", icon: "scholar"}
    - {label: "GitHub",   url: "https://github.com/zeng-yirong", icon: "github"}
  badges: ["一作 9 篇（CCF-A×4）", "6 篇 CCF-A 在投", "Agentic RL · IF"]

# 显示顺序（本人 2026-09-30 定稿）：教育背景 → 研究方向 → 发表论文 → 实习经历。
# 演变：2026-09-29 是「研究绝对优先」（研究方向 → 论文 → 实习 → 教育），
# 2026-09-30 按本人要求把**教育背景提到最前**，研究两段紧随其后，实习落到论文之后。
# 开头的 summary 与末尾的开源 / 荣誉|项目 / 技能 不动。
# 想在页眉下加一条数字速览？在这里插一行即可（B 模板已支持该分支）：
#   - {key: highlights, title: "数字速览", en: "HIGHLIGHTS"}
#
# 一行两栏的写法（与 C 版同一套，build.py 的 check() 负责校验）：
#   写成两元素列表            = 这两段并排
#   {pair: [左, 右], ratio: [a, b]} = 并排 + 逐行栏宽比（哪栏高就给哪栏多分宽，配平高度）
sections:
  - {key: summary}
  - {key: education,      title: "教育背景", en: "EDUCATION"}
  - {key: research_focus, title: "研究方向", en: "RESEARCH INTERESTS"}
  - {key: publications,   title: "发表论文", en: "PUBLICATIONS"}
  - {key: internship,     title: "实习经历", en: "INDUSTRY EXPERIENCE"}
  - {key: opensource,     title: "开源项目", en: "OPEN SOURCE"}
  # 荣誉奖项 + 项目经历并排（本人 2026-09-29 要求）：这两段都短，并排后省下一栏的高度，
  # 配合下面 skills 走注释，B 从 4 页压到 3 页。ratio 按两栏实际高度配——奖项条目多、
  # 是高的那栏，给它宽一点它才降下来（栏越宽、每条越少折行）。调完记得看页数。
  - {pair: [{key: awards,   title: "荣誉奖项", en: "HONORS & AWARDS"},
            {key: projects, title: "项目经历", en: "PROJECTS"}],
     ratio: [1.2, 0.8]}
  # 技能：本人 2026-09-29 要求从版面上撤掉（也是为压到 3 页）。事实与数据都留着，
  # 模板走注释分支：产物里能看到那段标记、页面上看不到。想恢复就删掉 comment_only。
  - {key: skills,         title: "技能",     en: "SKILLS", comment_only: true}

