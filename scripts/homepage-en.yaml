# ============================================================
# 主页英文文案（手工维护）—— sync-homepage.py 的输入之一
#
# 为什么需要这个文件：CV/build/data/*.yaml 全是中文，主页的英文版是**译文**，
#   没有哪份数据能推出它来。所以事实（标题/作者/venue/链接/时间/数字）由脚本从
#   CV 生成，**译文**放在这里手工维护。
#
# 脚本只读不写本文件：改英文措辞直接改这里，然后跑
#     python scripts/sync-homepage.py
# 重新生成 data/ 下的产物。
#
# 键的约定：凡是按「CV 里的中文名」索引的地方（experience.groups、software），
#   键必须与 CV 里的写法**逐字相同**。对不上时脚本会报错并列出没匹配上的键，
#   不会静默丢掉内容。
# ============================================================

# 华为实习（主栏 Experience）。中文侧由脚本从 CV 生成，这里只提供英文。
experience:
  title: "AI Algorithm Engineer (Research Intern)"
  company: "Huawei (Beijing) · Xiaoyi Foundation Algorithm Dept."
  details: >-
    As a research intern, led the pioneer exploration of system-level training
    techniques for Xiaoyi's omni-modal large models: 12 research outcomes across
    Agentic RL, Harness Agent training and instruction following, 4 of which
    shipped in Xiaoyi's production business.
  # 键 = CV internship.groups[].title（中文组名）。数组顺序 = 该组的条目顺序，
  # 与 CV 里的 items 一一对应（条数对不上时脚本报错）。
  groups:
    "Agentic RL 算法研发":
      title: "Agentic RL Algorithm R&D"
      items:
        - "Identified excessive invalid interactions in trajectories as a key cause of late-stage performance stagnation / collapse in long-horizon Agentic RL; improved training stability and the performance ceiling via early trajectory truncation + token masking 【**NeurIPS 2026**, ICLR 2027 under review】"
        - "Proposed a decoupled entropy-constraint strategy, letting the model adaptively switch between fast and slow thinking according to problem difficulty while using tools 【**AutoTool, ICLR 2026**】"
        - "Completed training adaptation for the Huawei Ascend NPU ecosystem; initial exploration of credit assignment for RL training feedback 【iTool EMNLP 2025; Tool Zero EMNLP 2025】"
    "Harness Agent 训练体系搭建":
      title: "Harness Agent Training Pipeline"
      items:
        - "Built an SFT data production pipeline yielding 20k+ samples covering 42 categories of Harness usage scenarios, supporting large-scale agent training data supply 【NeurIPS 2026】"
        - "Led the construction of 139 Agentic RL tool environments, supporting the business unit's pioneer Agentic RL exploration 【ICLR 2027 under review】"
        - "Designed a lightweight Harness supporting large-scale online In-Harness RL training: 8× lower training cost and 32% lower inference cost 【AAAI 2027 under review】"
    "Agent 指令遵循性能提升":
      title: "Instruction-Following Performance"
      items:
        - "Found feedback-signal quality to be the key bottleneck of instruction following under RL; proposed density control under multiple constraints, raising the performance ceiling at low cost. Deployed to Xiaoyi's in-house model with dialogue satisfaction **81→89** 【ICLR 2027 under review】"
        - "A lightweight specialist ensemble to mitigate reward hacking in multi-constraint RL: +10% average performance, +12% reward precision, 3× training speed 【**TinyJudge, ACL 2026**】"
        - "Explored on-policy distillation (OPD) for instruction following: decoupled-aggregated correction of the teacher's distribution under multiple constraints, +4% performance 【ICLR 2027 under review】"

# 研究方向（主栏 interests）。键 = CV research_focus[].name（中文组名，逐字相同）。
# bullets 与该组的 bullets 一一对应，条数对不上时脚本报错。
#
# ⚠️ time 必须**整串**给出，不能只给区间：CV 里写的是「2024.09 – 至今」，带中文
#   「至今」，从 CV 推不出英文。脚本会校验这里的起始日期（"2024.09"）与 CV 一致，
#   不一致就报错 —— 防的是「CV 改了日期、这里忘了跟着改」。
research_focus:
  "智能体强化学习（Agentic RL）":
    name: "Agentic Reinforcement Learning"
    time: "2024.09 - Present"
    # ⚠️ 条数必须与 CV research_focus 里那条**逐条对应**（脚本会校验）。
    # 2026-10-03：CV 里把「近期探索：通过训练 Skill 管理器…」注释掉了，这里也同步去掉；
    # 那句在主页上仍然显示 —— 它被搬到了 sync-homepage.py 的 INTEREST_EXTRA（主页专属补充）。
    bullets:
      - "Acquiring environment and human feedback through tool calls and continuously updating model parameters to raise the performance ceiling — a mainstream post-training route for large models."
      - "Research coverage: stability and ceiling of long-horizon training (NeurIPS 2026, EMNLP 2025×2, ICLR 2027 under review), adaptive fast/slow thinking (ICLR 2026), tool environments and data synthesis (NeurIPS 2026, ICLR 2027 under review), and lightweight Harness with In-Harness RL (AAAI 2027 under review)."
  "指令遵循（Instruction Following）":
    name: "Instruction Following"
    time: "2025.06 - Present"
    bullets:
      - "Satisfying user-specified constraints while producing an answer — a prerequisite capability for agent dialogue and long-horizon task execution."
      - "Research coverage: generalization mechanisms and ceiling improvement of instruction following under RL (ACL 2026, ICLR 2027 under review), multimodal instruction-following RL data synthesis (ACL-ARR under review), and the application of on-policy distillation (OPD) to this setting."

# 开源/数据集。键 = CV opensource[].name（逐字相同）。
# 英文标题按 "{name} - {desc}" 拼、中文按 "{name} —— {desc}" 拼，所以这里只给英文 desc。
software:
  "ClawLoop":
    desc: "Lightweight Harness & RL Training Framework"
  "ClawForge (EnvCraft)":
    desc: "Agentic RL Environments, Training Code & Models"
  "MIFS":
    desc: "Multimodal Instruction-Following Dataset"

