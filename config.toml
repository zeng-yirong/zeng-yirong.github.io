# Page settings
baseURL = "https://zeng-yirong.github.io/"
theme = "hugo-devresume-theme"
publishDir = "docs"

# ============================================================
# 中英双语（2026-10-01 改造）
#
#   defaultContentLanguage = "en"  → 英文是默认语言，站点根 / 就是英文页
#   defaultContentLanguageInSubdir = false → 英文不放进 /en/ 子目录，中文在 /zh/
#
# **内容的两棵树都写全**：`[languages.en.params]` 与 `[languages.zh.params]` 各自是一棵
# 完整的 params 树，根上**不留** `[params]`。为什么不写成「根上放共用项、语言里只覆盖文字」
# 那种省一半字的写法：Hugo 对**数组**（`[[…information.list]]` 这些）的合并语义在版本间
# 不一致（覆盖还是追加说不准），一旦它变成追加，英文那 15 篇论文就会出现在中文页上。
# 两棵写全 = 不依赖任何合并行为，两个页面完全可预期。
# 代价：改内容要改两处，跟 CV/build/data/ 下那三份 YAML 是同一个套路、同一套纪律。
#
# 改完必须 `hugo --minify` 重建 docs/ 并提交——线上（zeng-yirong.github.io）服务的就是
# 仓库里的 docs/ 目录，只改本文件不上线。
#
# 键集必须两边一致：段落开关（enable）、colors、结构。**文本**按语言各写各的。
# ============================================================

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]

