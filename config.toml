# Page settings
baseURL = "https://zeng-yirong.github.io/"
publishDir = "public"

# 这里原先有 theme = "hugo-devresume-theme"。2026-10-01 把主题从 themes/ 提升到了仓库根
# （layouts/ assets/ static/），不再作为主题加载 —— 理由见 CLAUDE.md「主题已本地化」一节：
# 这份主题从 UI 改版起就没有再跟过上游，theme.toml 指向的 cowboysmall-tools 那份早已合不回来，
# 挂在 themes/ 下只会让所有站点文件白白深一层。

# ============================================================
# 中英双语（2026-10-01 改造，2026-10-03 改为中文优先）
#
#   defaultContentLanguage = "zh"  → 中文是默认语言，站点根 / 就是中文页
#   defaultContentLanguageInSubdir = false → 中文不放进 /zh/ 子目录，英文在 /en/
#
# ⚠️ 改这个键会**同时改变 URL 布局**，不只是换默认显示：原来 / 是英文、/zh/ 是中文，
#    现在是 / 中文、/en/ 英文。Hugo 会为默认语言的那个旧子目录自动生成跳转页
#    （现在是 public/zh/index.html → 跳回 /），所以老书签不会死，但指向 / 的老链接
#    会从英文变成中文。改之前先想清楚有没有对外发过的链接依赖 / 是英文。
#
# **内容的两棵树都写全**：`[languages.en.params]` 与 `[languages.zh.params]` 各自是一棵
# 完整的 params 树，根上**不留** `[params]`。为什么不写成「根上放共用项、语言里只覆盖文字」
# 那种省一半字的写法：Hugo 对**数组**的合并语义在版本间不一致（覆盖还是追加说不准），
# 一旦它变成追加，英文那 15 篇论文就会出现在中文页上。
# 两棵写全 = 不依赖任何合并行为，两个页面完全可预期。
#
# 改完用 `hugo --minify` 重建 public/ 本地核对；上线是 push main 由 CI 构建，
# 仓库里不保存构建产物。
#
# 键集必须两边一致：段落开关（enable）、colors、结构。**文本**按语言各写各的。
#
# ------------------------------------------------------------
# 内容分家（2026-10-01）：长内容已移出本文件
#
#   论文 15 条、开源 4 条、华为实习（三组 9 条）本来写在这里，两语言各一份、共 300 多行，
#   而且和 CV/build/data/ 是同一批数据的手工副本。现在它们搬到 data/ 下，由
#       python scripts/sync-homepage.py
#   从 CV/build/data/A-general.yaml 生成（英文译文来自 scripts/homepage-en.yaml）。
#   **data/ 下的文件是产物，不要手改**；改内容去改 CV 的数据，再跑那个脚本。
#
#   留在本文件里的是「配置」而不是「内容」：段落开关、颜色、以及短到不值得外置的几行
#   （头像、联系方式、教育、兴趣、爱好、社交）。
# ============================================================

defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false

# 这个站没有 content/ 目录，但 Hugo 默认仍会生成 taxonomy（tags/categories）和 RSS
# 的 kind —— 它们没有对应的 index.html（本站没有 list 模板），于是 GitHub Pages
# 把那份 index.xml 直接当目录页返回：/categories/ /tags/ 线上是 200 + application/xml，
# 访客点进去看到的是裸 RSS。而 sitemap 每语言只列 3 个 URL，其中 2 个正是这些伪页面。
#
# 关掉之后这些 URL 变成真正的 404，交给自定义 404 页（layouts/404.html）。
# sitemap 本身保留（不列入 disableKinds），全站模板也没有任何地方引用 RSS。
#
# ⚠️ 必须写在 [languages] 之前：TOML 里裸键只属于第一张表头之前的根表，
#    写进去会变成 languages.disableKinds，Hugo 连警告都不会给。
disableKinds = ["taxonomy", "term", "rss"]

[languages]

# ------------------------------------------------------------
# 英文（/en/）
# ------------------------------------------------------------
[languages.en]
    languageName = "English"
    languageCode = "en"
    title = "Hi, I'm Yirong"
    weight = 2

    [languages.en.params]
        author = "Yirong Zeng"
        description = "Yirong Zeng's Academic Resume"
        # 2026-10-03 二次改版（方案 4「明亮多彩」）：亮蓝 + 石板黑，卡片式布局。
        # 这两个值注入 assets/scss/devresume.scss，SCSS 里其余 token 在那边写死
        # （各内容类型的淡色底板、在投徽章的洋红等，都在 SCSS 顶部那个 token 块里）。
        # 两棵语言树必须都写（值相同）—— 见本文件顶上「内容的两棵树都写全」。
        primaryColor = "#2563eb"
        textPrimaryColor = "#0f172a"

        [languages.en.params.profile]
            enable = true
            name = "Yirong Zeng (曾屹荣)"
            tagline = "Ph.D. Candidate · Agentic RL / Long-Horizon Agent Training"
            avatar = "me.png"

        [languages.en.params.contact]
            enable = true
            # location 留着，但模板里那一行现在被 HTML 注释保留着（本仓约定：不显示的部件
            # 以注释留在模板里）。2026-10-03 按要求把地点位置换成 GitHub，想恢复改模板一行即可。
            location = "Harbin"

            [[languages.en.params.contact.list]]
            icon = "fas fa-envelope-square"
            url = "mailto:yrzeng@ir.hit.edu.cn"
            text = "Mail"
            [[languages.en.params.contact.list]]
            icon = "fab fa-google"
            url = "https://scholar.google.com/citations?user=HZgQfW0AAAAJ"
            text = "Google Scholar"
            # ⚠️ 这个 URL 与 social.list 里那份是刻意重复的 —— 头部和页脚都要显示 GitHub。
            #    改的时候两处一起改，别让它变成无人察觉的第二事实源。
            [[languages.en.params.contact.list]]
            icon = "fab fa-github-square"
            url = "https://github.com/zeng-yirong"
            text = "GitHub"

            # 三个版本的简历（HTML）。产物在 static/cv/，Hugo 原样发布到 /cv/。
            # ⚠️ 模板里必须用 relURL（不是 relLangURL）—— 后者在 /en/ 页会拼出 /en/cv/… 而 404。
            # ⚠️ 这三份都是**中文**简历，所以即使英文页也标出语言，别让读者以为点了会看到英文版。
            [languages.en.params.contact.cv]
                icon = "fas fa-file-alt"
                prefix = "CV (中文)"
                [[languages.en.params.contact.cv.list]]
                url = "/cv/resume-A-general.html"
                text = "General"
                [[languages.en.params.contact.cv.list]]
                url = "/cv/resume-B-institute.html"
                text = "Institute"
                [[languages.en.params.contact.cv.list]]
                url = "/cv/resume-C-talent.html"
                text = "Talent"

        [languages.en.params.summary]
            enable = true
            # 这里允许 markdown：模板走 `| markdownify`（layouts/partials/summary.html）。
            # ⚠️ 别在字符串里加空行 —— 空行会让 markdownify 返回 <p>，嵌进外层 <p class="mb-0">
            #    是非法嵌套，浏览器会把外层 <p> 拆掉。
            text = "I am a fifth-year Ph.D. student at Harbin Institute of Technology (advisor: Prof. Ting Liu), in the [Research Center for Social Computing and Information Retrieval (SCIR)](https://ir.hit.edu.cn/). My research focuses on Agentic RL, Harness Agent training and instruction following for large language models. I have published 9 first-author (incl. co-first) papers at NeurIPS, ICLR, ACL, EMNLP, NAACL, COLING and IPM — 4 CCF-A, 4 CCF-B, 1 SCI-Q1 — with 6 more CCF-A papers under review. I was among the first batch of Huawei Xiaoyi Top-Talent Program interns, and served as the intern lead of the department."

        [languages.en.params.education]
            enable = true

            [[languages.en.params.education.list]]
            degree = "Ph.D. - Computer Science"
            university = "Harbin Institute of Technology"
            dates = "2022.09 - 2027.09 (expected)"
            [[languages.en.params.education.list]]
            degree = "Bachelor - Computer Science"
            university = "Harbin Engineering University"
            dates = "2018.09 - 2022.07"

        # 侧栏「实习经历」。华为那段**由脚本从 CV 生成**（侧栏读
        # data/<lang>/experience.yaml 的 sidebar_org / sidebar_dates），
        # 不在这里再抄一份 —— 抄了的话 CV 改日期时，侧栏会和主栏并存两个不同的日期。
        # 所以这里只列主页独有、CV 里没有的两段早期实习。
        [languages.en.params.internships]
            enable = true

            [[languages.en.params.internships.list]]
            org = "China Academy of Cyber"
            dates = "2023.7 - 2023.12"
            [[languages.en.params.internships.list]]
            org = "NEC"
            dates = "2021.12 - 2022.5"

        # 研究方向。内容在 data/<lang>/interests.yaml（自动生成，来自 CV 的 research_focus）。
        [languages.en.params.interests]
            enable = true

        # 2026-10-03 按要求从侧栏去掉。partial 与下面的数据都留着 —— 想恢复把 enable 打开即可。
        [languages.en.params.hobbies]
            enable = false

            [[languages.en.params.hobbies.list]]
            name = "Skiing / Badminton"

        # 主栏第一段：华为实习。内容在 data/en/experience.yaml（自动生成）。
        [languages.en.params.experience]
            enable = true

        # 论文。内容在 data/publications.yaml（自动生成，两语言共用一份）。
        [languages.en.params.information]
            enable = true

        # 开源项目与数据集。内容在 data/software.yaml（自动生成）。
        [languages.en.params.software]
            enable = true

        # 以下几段本人 2026-10-01 未勾选，保持关闭；数据已不在本文件里，
        # 打开 enable 之前要先补回对应的数据（awards/projects 的源在 CV/build/data/A-general.yaml）。
        [languages.en.params.awards]
            enable = false
        [languages.en.params.projects]
            enable = false
        [languages.en.params.skills]
            enable = false
        [languages.en.params.languages]
            enable = false

        [languages.en.params.social]
            enable = true

            [[languages.en.params.social.list]]
            icon = "fab fa-github-square"
            url = "https://github.com/zeng-yirong"
            title = "zeng-yirong"

